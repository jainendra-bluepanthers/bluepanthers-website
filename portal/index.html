<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Team portal · Blue Panthers Manufacturing</title>
<link rel="icon" href="/assets/img/favicon.png">
<style>
/* Team status portal. Site palette (assets/css/site.css): navy rail, light page, saffron accent.
   Layout: rail on the left, KPI strip, pipeline bars, due list, tables. */
:root{--navy:#092c46;--navy2:#0d3b5b;--blue:#07599b;--ink:#153044;--text:#3e5263;--muted:#657684;--line:#d9e1e5;--bg:#f6f8f9;--tint:#eef3f6;--white:#fff;--accent:#c0743a;--green:#2f7a4b;--late:#b4462a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
a{color:var(--blue)}button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--navy),var(--navy2))}
.lcard{background:var(--white);width:min(400px,100%);border-radius:8px;padding:32px 28px;box-shadow:0 20px 60px #0004}
.lcard img{height:40px;display:block;margin-bottom:18px}
.lcard h1{font-size:22px;margin:0 0 4px}.lcard p{color:var(--muted);margin:0 0 20px}
.lcard label{display:block;font-size:12.5px;font-weight:600;color:var(--text);margin:12px 0 4px}
.lcard input{width:100%;border:1px solid var(--line);border-radius:6px;padding:11px 12px;font-size:16px;background:var(--bg)}
.lcard button{width:100%;margin-top:20px;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:12px;font-weight:600;cursor:pointer;font-size:15px}
.lcard button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--late);font-size:13px;min-height:20px;margin-top:10px}
.small{font-size:12px;color:var(--muted);margin-top:16px}
/* app */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#e8eef3;padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.brand img{height:34px;background:#fff;border-radius:4px;padding:3px}
.brand b{display:block;font-size:14px;line-height:1.2}.brand small{color:#9fb3c3;font-size:12px}
.grp{font-size:11px;letter-spacing:.08em;color:#9fb3c3;margin:10px 8px 4px;font-weight:600}
.nav a{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:6px;color:#e8eef3;text-decoration:none;font-size:13.5px;min-height:38px}
.nav a:hover{background:#ffffff14}.nav a.on{background:var(--accent);color:#fff;font-weight:600}
.nav .n{font-size:11px;background:#ffffff22;border-radius:9px;padding:0 7px}
.foot{margin-top:auto;border-top:1px solid #ffffff22;padding:12px 8px 0;font-size:12.5px}
.foot button{background:none;border:0;color:#fff;font-weight:600;padding:6px 0;cursor:pointer}
main{padding:18px clamp(16px,3vw,40px) 60px;max-width:1300px;width:100%}
.top{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;font-size:12.5px;color:var(--muted)}
.top b{color:var(--navy)}
h1.t{font-size:clamp(26px,3.2vw,36px);line-height:1.1;margin:22px 0 6px;color:var(--navy);letter-spacing:-.01em}
.sub{color:var(--text);margin:0 0 18px;max-width:900px}
.card{background:var(--white);border:1px solid var(--line);border-radius:8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
.kpi{padding:16px 20px;border-left:1px solid var(--line)}.kpi:first-child{border-left:0}
.kpi span{font-size:12.5px;font-weight:600;color:var(--text);display:flex;gap:7px;align-items:center}.kpi i{width:8px;height:8px;border-radius:50%}
.kpi b{display:block;font-size:32px;line-height:1.15;margin-top:6px;color:var(--navy)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.vc{padding:16px 18px;display:flex;flex-direction:column}
.vc h2{font-size:16px;margin:0 0 6px}.vc p{color:var(--text);font-size:13px;margin:0 0 12px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 26px;gap:10px;align-items:center;font-size:12.5px;padding:2px 0}
.bar i{height:7px;background:var(--tint);border-radius:9px;overflow:hidden}.bar i b{display:block;height:100%;background:var(--blue);border-radius:9px}
.bar em{font-style:normal;font-weight:700;text-align:right}
.vc .go{margin-top:auto;padding-top:12px;font-size:12.5px}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.ch{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px 8px}
.ch h2{font-size:16px;margin:0}.ey{font-size:10.5px;letter-spacing:.09em;font-weight:600;color:var(--muted)}
.list>div{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;padding:9px 18px;border-top:1px solid var(--line);font-size:13px;align-items:start}
.list small{display:block;color:var(--muted)}
.late{color:var(--late);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.tools input,.tools select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:15px;min-height:40px;background:var(--white)}
.tools input{flex:1 1 220px}.ct{margin-left:auto;color:var(--muted);font-size:12.5px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:12px;color:var(--muted);background:var(--tint);padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
td b{color:var(--ink)}td small{display:block;color:var(--muted)}
.r{text-align:right}.nw{white-space:nowrap}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--tint);color:var(--text);white-space:nowrap}
.c-good{background:#dff0e2;color:var(--green)}.c-talk{background:#efe6f3;color:#7e4f91}.c-wait{background:#e2edf6;color:var(--blue)}.c-draft{background:#f6ecd9;color:#8a6a2b}.c-no{background:#efefec;color:#8a8c86;text-decoration:line-through}
.tier{font-size:11px;color:var(--muted);text-transform:none}
.grouprow td{background:var(--bg);font-weight:700;color:var(--navy);font-size:12.5px}
.note{font-size:12.5px;color:var(--muted);padding:10px 14px}
.banner{background:#fff6e8;border:1px solid #f0d9b5;color:#7a5520;border-radius:8px;padding:10px 14px;margin:14px 0;font-size:13px}
.now{color:var(--accent);font-weight:700}
details.card{margin-top:14px}details.card summary{cursor:pointer;padding:12px 18px;font-weight:600;color:var(--navy)}
.top a{font-weight:600}
/* progress charts: vertical hues validated together (CVD and normal-vision separation, 3:1 on white) */
.viz{--v-cm:#07599b;--v-rm:#00a888;--v-eq:#c0743a;--grid:#e6ecef;--axis:#8a97a1}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.chart{padding:14px 18px 12px;position:relative}
.chart h2{font-size:15px;margin:0}.chart p.cap{margin:2px 0 8px;font-size:12.5px;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{font:11px Inter,system-ui,sans-serif;fill:var(--muted)}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text);margin:0 0 6px}
.lg span{display:inline-flex;align-items:center;gap:6px}.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--white)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:13px;min-height:36px}.seg button.on{background:var(--navy);color:#fff}
.tip{position:fixed;pointer-events:none;background:var(--white);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px #0002;padding:8px 10px;font-size:12.5px;z-index:9;min-width:150px}
.tip b{display:block;color:var(--navy);margin-bottom:3px}.tip div{display:flex;justify-content:space-between;gap:12px}.tip i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
.hit{fill:transparent;cursor:crosshair}.hit:hover+.hl,.hl.on{opacity:1}.hl{opacity:0;pointer-events:none}
details.tv summary{cursor:pointer;font-size:12.5px;color:var(--blue);padding:6px 0 0}
details.tv table{margin-top:6px;font-size:12px}details.tv td,details.tv th{padding:5px 8px}
.empty{color:var(--muted);font-size:13px;padding:24px 0;text-align:center}
@media(max-width:1000px){.pgrid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:1000px){.three,.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:820px){.app{grid-template-columns:minmax(0,1fr)}.side{position:static;height:auto}.nav{display:flex;overflow-x:auto;gap:4px}.nav a{flex:none}.grp,.foot small{display:none}.foot{margin-top:6px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
</style>
</head>
<body>
<section class="login" id="login">
  <form class="lcard" id="lf" autocomplete="on">
    <img src="/assets/img/logo.png" alt="Blue Panthers Manufacturing">
    <h1>Team portal</h1>
    <p>Project status for the Blue Panthers team.</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <button id="lb" type="submit">Log in</button>
    <div class="err" id="er" role="alert"></div>
    <div class="small">For Blue Panthers team members only. Ask Jainendra for access.</div>
  </form>
</section>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><img src="/assets/img/logo.png" alt=""><div><b>Team portal</b><small>Blue Panthers Manufacturing</small></div></div>
    <div class="grp">STATUS</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><small id="who"></small><br><button id="lo" type="button">Log out</button></div>
  </aside>
  <main>
    <div class="top"><div><b>Blue Panthers</b> / Team portal</div><div id="asof"></div></div>
    <div id="msg"></div>
    <h1 class="t" id="title"></h1><p class="sub" id="sub"></p>
    <div id="view"></div>
  </main>
</div>

<script>
{
/* Team status portal. keys.json and data.json next to this page hold only encrypted data.
   A member's password unlocks the team key (PBKDF2 + AES-GCM); the team key opens the status
   (RSA-OAEP + AES-GCM). The status is rebuilt from the tracker sheets every 15 minutes. */
const $=s=>document.querySelector(s);
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(s)};
const te=new TextEncoder(),td=new TextDecoder();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=async f=>{const r=await fetch(f+'?t='+Date.now(),{cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw new Error('net');return r.json()};
let S=null,H='',who='',priv=null,kid='';

async function gcm(keyBytes,box){
  const k=await crypto.subtle.importKey('raw',keyBytes,'AES-GCM',false,['decrypt']);
  return crypto.subtle.decrypt({name:'AES-GCM',iv:ub(box.iv)},k,ub(box.ct));
}
const importPriv=der=>crypto.subtle.importKey('pkcs8',der,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);
async function login(email,pw){
  const K=await get('/portal/keys.json');if(!K||!K.slots.length)throw new Error('nokeys');
  const id=hex(await crypto.subtle.digest('SHA-256',te.encode('bpm-portal:'+email.trim().toLowerCase())));
  const slot=K.slots.find(s=>s.id===id)||K.slots[0];
  const base=await crypto.subtle.importKey('raw',te.encode(pw.normalize('NFC')),'PBKDF2',false,['deriveBits']);
  const kek=await crypto.subtle.deriveBits({name:'PBKDF2',salt:ub(slot.salt),iterations:K.iter,hash:'SHA-256'},base,256);
  if(slot.id!==id)throw new Error('no');
  const der=await gcm(kek,slot.key);
  who=td.decode(await gcm(kek,slot.name));priv=await importPriv(der);kid=K.kid;
  try{sessionStorage.setItem('bpm_portal',JSON.stringify({p:bu(der),w:who,k:kid}))}catch(e){}
}
async function resume(){
  try{const s=JSON.parse(sessionStorage.getItem('bpm_portal')||'null');if(!s)return false;who=s.w;kid=s.k;priv=await importPriv(ub(s.p));return true}catch(e){return false}
}
function logout(note){try{sessionStorage.removeItem('bpm_portal')}catch(e){}S=null;priv=null;
  $('#app').hidden=true;$('#login').hidden=false;$('#pw').value='';$('#er').textContent=note||'';history.replaceState(null,'',location.pathname)}
/* Returns 'ok', 'same', 'none' (no status yet) or 'relogin' (logins changed since this session started). */
async function load(){
  const D=await get('/portal/data.json');
  if(!D){S=S||null;return 'none'}
  if(D.h===H&&S)return 'same';
  if(D.kid!==kid){const K=await get('/portal/keys.json');return K&&K.kid!==kid?'relogin':'pending'}
  const key=await crypto.subtle.decrypt({name:'RSA-OAEP'},priv,ub(D.box.w));
  S=JSON.parse(td.decode(await gcm(key,D.box)));H=D.h;HS=await loadHist();return 'ok';
}
/* Daily stage snapshots (history.json): one encrypted entry per day; entries from an older team key are skipped. */
let HS=[];
async function loadHist(){
  try{const X=await get('/portal/history.json');if(!X)return [];const out=[];
    for(const e of X.days||[]){if(e.kid!==kid)continue;try{const k=await crypto.subtle.decrypt({name:'RSA-OAEP'},priv,ub(e.box.w));out.push(JSON.parse(td.decode(await gcm(k,e.box))))}catch(x){}}
    return out.sort((a,b)=>a.d.localeCompare(b.d))}catch(e){return []}
}

/* ---------- helpers */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=s=>{if(!s)return '';const p=s.split('-');return (+p[2])+' '+MON[+p[1]-1]};
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())};
let TODAY=today();
const open=r=>!/^(Rejected|No response)$/i.test(r.stage);
const isDue=r=>open(r)&&(r.now||(r.due&&r.due<=TODAY));
const due=r=>r.now?'<span class="now">Now</span>':r.due?`<span class="nw ${open(r)&&r.due<TODAY?'late':''}">${fmt(r.due)}</span>`:'<span style="color:var(--muted)">-</span>';
const cls=s=>/Quote received|Quoted|Approved|Contracted|Negotiated|Sample approved|Shortlisted|Ordered/.test(s)?'c-good':/discussion|Capability|NDA|Trial|Sample received|Clarification/.test(s)?'c-talk':/sent|Contacted/.test(s)?'c-wait':/raft/.test(s)?'c-draft':/Rejected|No response/.test(s)?'c-no':'';
const cert=c=>!c||/^(Ask|Unknown|n\/a)$/i.test(c)?'<span style="color:var(--muted)">Not known yet</span>':esc(c);
const chip=s=>`<span class="chip ${cls(s)}">${esc(s)}</span>`;
const NAME={cm:'Contract manufacturing',rm:'Raw materials',eq:'Plant equipment'};
const EYE={cm:'VERTICAL 1',rm:'VERTICAL 2',eq:'VERTICAL 3'};
const VIEWS={overview:'Overview',progress:'Daily progress',cm:NAME.cm,rm:NAME.rm,eq:NAME.eq,dates:'Key dates'};
const SUB={overview:'Where we are across the three verticals, read from our tracker sheets.',
  cm:'Plants near Bangalore that can make our product in small batches until our own plant is ready.',
  rm:'Suppliers for each raw material and the 25 kg bags, checked against our spec and priced delivered Bangalore.',
  eq:'RFQs for our own plant: who has quoted, what is pending, and how quotes compare with the budget.',
  dates:'Deadlines and follow-ups.',
  progress:'Day by day: emails out, replies in, quotes in hand and how each pipeline is moving. Built from the dates written in the tracker sheets.'};
const stg=v=>S.stages&&S.stages[v]&&S.stages[v].length?S.stages[v]:[...new Set(S[v].map(r=>r.stage))];
function bars(v){const R=S[v],c=s=>R.filter(r=>r.stage===s).length,max=Math.max(1,...stg(v).map(c));
  return stg(v).filter(s=>c(s)).map(s=>`<div class="bar"><span>${esc(s)}</span><i><b style="width:${c(s)/max*100}%"></b></i><em>${c(s)}</em></div>`).join('')}
const sheet=v=>S.links&&S.links[v]?` · <a href="${esc(S.links[v])}" target="_blank" rel="noopener">Open the tracker</a>`:'';
let view='overview',F={q:'',st:''};

function vOverview(){
  const all=[...S.cm.map(r=>({...r,v:'cm'})),...S.rm.map(r=>({...r,v:'rm'})),...S.eq.map(r=>({...r,v:'eq'}))];
  const k=[['Plants in play (near Bangalore, trials)',S.cm.filter(r=>r.tier<3&&open(r)).length,'#07599b'],['Raw-material suppliers in play',S.rm.filter(open).length,'#2f7a4b'],['Equipment prices in hand',S.eq.filter(r=>r.priced).length,'#c0743a'],['Follow-ups due now',all.filter(isDue).length,'#b4462a']];
  // Drafts waiting to be sent are grouped into one line per vertical and action; dated items follow.
  const G={};all.filter(r=>open(r)&&r.now).forEach(r=>{const g=G[r.v+'|'+r.act]=G[r.v+'|'+r.act]||{v:r.v,act:r.act,co:new Set()};g.co.add(r.co)});
  const nowRows=Object.values(G).map(g=>{const c=[...g.co];return `<div><span class="now">Now</span><div><b>${esc(g.act)}: ${c.length} ${c.length>1?'companies':'company'}</b><small>${esc(c.slice(0,4).join(', '))}${c.length>4?` and ${c.length-4} more`:''}</small></div><span class="chip">${esc(NAME[g.v])}</span></div>`});
  const up=all.filter(r=>open(r)&&!r.now&&r.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,Math.max(6,12-nowRows.length));
  return `<div class="card kpis">${k.map(([l,n,c])=>`<div class="kpi"><span><i style="background:${c}"></i>${l}</span><b>${n}</b></div>`).join('')}</div>
  <div class="three">${['cm','rm','eq'].map(v=>`<section class="card vc"><div class="ey">${EYE[v]}</div><h2>${NAME[v]}</h2><p>${esc(S.summary[v])}</p>${bars(v)}<span class="go"><a href="#${v}">Open the list</a>${sheet(v)}</span></section>`).join('')}</div>
  <div class="two"><section class="card"><div class="ch"><h2>Next follow-ups</h2><a href="#dates" style="font-size:12.5px">Key dates</a></div><div class="list">${nowRows.join('')+up.map(r=>`<div>${due(r)}<div><b>${esc(r.co)}</b><small>${esc(r.act)}</small></div><span class="chip">${esc(NAME[r.v])}</span></div>`).join('')||'<div><span></span><div>Nothing scheduled.</div><span></span></div>'}</div></section>
  <section class="card"><div class="ch"><h2>Key dates</h2></div>${keyList(S.key.slice(0,6))}</section></div>`;
}
const keyList=K=>`<div class="list">${K.map(k=>`<div><span class="${k.d&&k.d<TODAY?'late':''}">${esc(k.label)||fmt(k.d)}</span><div>${esc(k.s)}<small>${esc(k.v)}</small></div><span></span></div>`).join('')||'<div><span></span><div>No dates listed.</div><span></span></div>'}</div>`;
function tools(v,extra){return `<div class="tools"><input id="q" type="search" placeholder="Search company, note, next action" value="${esc(F.q)}" aria-label="Search">
  <select id="st" aria-label="Stage"><option value="">All stages</option>${stg(v).map(s=>`<option ${F.st===s?'selected':''}>${esc(s)}</option>`).join('')}</select>${extra||''}<span class="ct" id="ct"></span></div>`}
function filt(R){const q=F.q.toLowerCase();return R.filter(r=>(!F.st||r.stage===F.st)&&(!q||Object.values(r).join(' ').toLowerCase().includes(q)))}
function vCM(){return `<section class="card">${tools('cm')}<div class="tw" id="tb"></div>${S.notes&&S.notes.cm?`<div class="note">${esc(S.notes.cm)}</div>`:''}</section>`}
function tCM(){const R=filt(S.cm);let h='',last=0;
  for(const r of R){if(r.tier!==last){last=r.tier;h+=`<tr class="grouprow"><td colspan="6">${esc(r.tierName)}</td></tr>`}
    h+=`<tr><td><b>${esc(r.co)}</b><small>${esc(r.loc)}</small></td><td>${esc(r.cap)||'<span style="color:var(--muted)">Not known yet</span>'}<small>${cert(r.cert)}</small></td><td>${chip(r.stage)}</td><td>${esc(r.act)}${r.notes?`<small>${esc(r.notes)}</small>`:''}</td><td class="nw">${due(r)}</td><td>${esc(r.owner)}</td></tr>`}
  return [R.length,`<table><thead><tr><th>Manufacturer</th><th>Dryer / certifications</th><th>Stage</th><th>Next action</th><th>Due</th><th>Owner</th></tr></thead><tbody>${h}</tbody></table>`]}
function vRM(){const N=S.notes&&S.notes.rm||[];
  return `<section class="card">${tools('rm',`<select id="mt" aria-label="Material"><option value="">All materials</option>${[...new Set(S.rm.map(r=>r.mat))].map(m=>`<option ${F.mt===m?'selected':''}>${esc(m)}</option>`).join('')}</select>`)}<div class="tw" id="tb"></div>${N.length?`<div class="note">${N.map(esc).join('<br>')}<br>Listing prices are not quotes.</div>`:''}</section>
  ${S.spec&&S.spec.length?`<details class="card"><summary>Spec limits for incoming material</summary><div class="tw"><table><thead><tr><th>Material</th><th>Key limits</th></tr></thead><tbody>${S.spec.map(s=>`<tr><td><b>${esc(s.mat)}</b><small>${esc(s.id)}</small></td><td>${esc(s.lim)}</td></tr>`).join('')}</tbody></table></div></details>`:''}`}
function tRM(){const R=filt(S.rm).filter(r=>!F.mt||r.mat===F.mt);
  return [R.length,`<table><thead><tr><th>Material</th><th>Supplier</th><th>Certifications</th><th>Price</th><th>Stage</th><th>Next action</th><th>Due</th></tr></thead><tbody>${R.map(r=>`<tr><td class="nw">${esc(r.mat)}</td><td><b>${esc(r.co)}</b><small>${esc([r.loc,r.type].filter(Boolean).join(' · '))}</small></td><td>${cert(r.cert)}</td><td>${r.quote?`<b>${esc(r.quote)}</b><small>Quote</small>`:r.listing?`${esc(r.listing)}<small>Listing</small>`:'<span style="color:var(--muted)">-</span>'}</td><td>${chip(r.stage)}</td><td>${esc(r.act)}${r.fit?`<small>${esc(r.fit)}</small>`:''}</td><td class="nw">${due(r)}</td></tr>`).join('')}</tbody></table>`]}
function vEQ(){
  const P=S.packages;const tot=P.reduce((a,p)=>a+(p.budget||0),0);const pct=p=>Math.round((p.low/p.budget-1)*100);
  return `<section class="card" style="margin-bottom:14px"><div class="ch"><h2>Budget by package</h2><span class="ey">INR LAKH, EX-GST</span></div><div class="tw"><table><thead><tr><th>Pkg</th><th>Package</th><th class="r">Suppliers</th><th class="r">RFQs sent</th><th class="r">Priced</th><th class="r">Lowest quote</th><th class="r">Budget</th><th class="r">vs budget</th></tr></thead><tbody>${P.map(p=>`<tr><td><b>${esc(p.k)}</b></td><td>${esc(p.n)}</td><td class="r">${p.suppliers}</td><td class="r">${p.contacted}</td><td class="r">${p.priced||''}</td><td class="r">${p.low==null?'-':p.low.toFixed(2)}</td><td class="r">${p.budget??'not set'}</td><td class="r">${p.low!=null&&p.budget?`<span class="${p.low>p.budget?'late':''}">${pct(p)>0?'+':''}${pct(p)}%</span>`:''}</td></tr>`).join('')}<tr><td></td><td><b>Total budgeted</b></td><td colspan="4"></td><td class="r"><b>${Math.round(tot*100)/100}</b></td><td></td></tr></tbody></table></div><div class="note">Lowest quote uses each supplier's main price column, as in the tracker's Quote Comparison tab.</div></section>
  ${S.quotes&&S.quotes.length?`<section class="card" style="margin-bottom:14px"><div class="ch"><h2>Quotes in hand</h2><span class="ey">FROM THE OVERVIEW TRACKER</span></div><div class="tw"><table><thead><tr><th>Item</th><th>Company</th><th class="r">Price</th><th>Basis</th><th>Compare with</th><th>Status</th></tr></thead><tbody>${S.quotes.map(q=>`<tr><td><b>${esc(q.item)}</b><small>${esc(q.date)}</small></td><td>${esc(q.co)}</td><td class="r nw"><b>${esc(q.price)}</b></td><td>${esc(q.basis)}</td><td>${esc(q.cmp)}</td><td>${esc(q.note)}</td></tr>`).join('')}</tbody></table></div></section>`:''}
  <section class="card">${tools('eq',`<select id="pk" aria-label="Package"><option value="">All packages</option>${P.map(p=>`<option value="${esc(p.k)}" ${F.pk===p.k?'selected':''}>${esc(p.k+' '+p.n)}</option>`).join('')}</select>`)}<div class="tw" id="tb"></div><div class="note">Due dates: the "reply by" date in the remarks, else 7 days after the last contact. Drafts waiting to be sent show as due now.</div></section>`}
function tEQ(){const o=stg('eq'),rank=s=>{const i=o.indexOf(s);return /^(Rejected|No response)$/.test(s)?-1:i};
  const R=filt(S.eq).filter(r=>!F.pk||r.pkg===F.pk).sort((a,b)=>rank(b.stage)-rank(a.stage)||(a.now?'':a.due||'9').localeCompare(b.now?'':b.due||'9'));
  return [R.length,`<table><thead><tr><th>Pkg</th><th>Supplier</th><th>Stage</th><th>Last update</th><th>Next action</th><th>Due</th></tr></thead><tbody>${R.map(r=>`<tr><td><b>${esc(r.pkg)}</b></td><td><b>${esc(r.co)}</b><small>${esc(r.city)}</small></td><td>${chip(r.stage)}${r.price?`<small>${esc(r.price)}</small>`:''}</td><td>${fmt(r.last)}${r.lastNote?`<small>${esc(r.lastNote)}</small>`:''}</td><td>${esc(r.act)}</td><td class="nw">${due(r)}</td></tr>`).join('')}</tbody></table>`]}
function vDates(){return `<section class="card">${keyList(S.key)}</section>
  <section class="card" style="margin-top:14px"><div class="ch"><h2>All follow-ups due now</h2></div><div class="list">${[...S.cm.map(r=>({...r,v:'cm'})),...S.rm.map(r=>({...r,v:'rm'})),...S.eq.map(r=>({...r,v:'eq'}))].filter(isDue).map(r=>`<div>${due(r)}<div><b>${esc(r.co)}</b><small>${esc(r.act)}</small></div><span class="chip">${esc(NAME[r.v])}</span></div>`).join('')||'<div><span></span><div>Nothing due.</div><span></span></div>'}</div></section>`}

/* ---------- daily progress */
const VC={cm:'var(--v-cm)',rm:'var(--v-rm)',eq:'var(--v-eq)'};
let RANGE='30',TIPS={};
const addD=(iso,n)=>{const t=new Date(Date.parse(iso+'T00:00:00Z')+n*864e5);return t.toISOString().slice(0,10)};
function dayList(a,b){const o=[];for(let d=a;d<=b&&o.length<800;d=addD(d,1))o.push(d);return o}
const nice=m=>{if(m<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(m))),f=m/p;return (f<=2?2:f<=5?5:10)*p};
/* rounded-top bar: 4px data end, square at the baseline */
function bar(x,y,w,h,r,fill){if(h<=0)return '';r=Math.min(r,w/2,h);return `<path style="fill:${fill}" d="M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z"/>`}
function frame(days,max,id,W,Hh){const L=30,R=6,T=8,B=22,pw=W-L-R,ph=Hh-T-B,n=days.length,band=pw/n;
  const k=Math.max(1,Math.ceil(n/7));let g='';
  for(const v of [0,max/2,max]){const y=T+ph-v/max*ph;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L-6}" y="${y+3.5}" text-anchor="end">${Math.round(v*10)/10}</text>`}
  days.forEach((d,i)=>{if((n-1-i)%k===0)g+=`<text x="${L+band*i+band/2}" y="${Hh-6}" text-anchor="middle">${fmt(d)}</text>`});
  return {L,T,pw,ph,band,g}}
function stack(id,days,series,get,tipOf,W=560,Hh=210){
  const tot=d=>series.reduce((a,s)=>a+get(d,s),0),max=nice(Math.max(1,...days.map(tot)));
  const f=frame(days,max,id,W,Hh),bw=Math.max(2,Math.min(22,f.band*.72));let m='';TIPS[id]=[];
  days.forEach((d,i)=>{const x=f.L+f.band*i+(f.band-bw)/2;let y=f.T+f.ph;const segs=series.map(s=>({s,v:get(d,s)})).filter(z=>z.v>0);
    segs.forEach((z,j)=>{const h=z.v/max*f.ph,top=j===segs.length-1;const hh=top?h:Math.max(1,h-2);y-=h;m+=top?bar(x,y,bw,hh,4,z.s.c):`<rect x="${x}" y="${y+2}" width="${bw}" height="${hh}" style="fill:${z.s.c}"/>`});
    TIPS[id][i]=tipOf(d);
    m+=`<rect class="hit" data-c="${id}" data-i="${i}" x="${f.L+f.band*i}" y="${f.T}" width="${f.band}" height="${f.ph}"/><rect class="hl" x="${f.L+f.band*i}" y="${f.T}" width="${f.band}" height="${f.ph}" fill="#0a2d4612"/>`});
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(id)}">${f.g}${m}<line x1="${f.L}" x2="${W-6}" y1="${f.T+f.ph}" y2="${f.T+f.ph}" stroke="var(--axis)"/></svg>`}
function line(id,days,vals,max,color,tipOf,W=560,Hh=210){
  max=nice(Math.max(1,max));const f=frame(days,max,id,W,Hh);TIPS[id]=[];
  const X=i=>f.L+f.band*i+f.band/2,Y=v=>f.T+f.ph-v/max*f.ph;
  let p='';vals.forEach((v,i)=>{p+=i?`H${X(i)}V${Y(v)}`:`M${X(0)},${Y(v)}`});
  let m='';vals.forEach((v,i)=>{if(i===0||v!==vals[i-1])m+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" style="fill:${color}" stroke="#fff" stroke-width="2"/>`});
  const last=vals.length-1;m+=`<text x="${X(last)}" y="${Y(vals[last])-9}" text-anchor="end" style="fill:var(--ink);font-weight:700">${vals[last]}</text>`;
  let h='';vals.forEach((v,i)=>{TIPS[id][i]=tipOf(days[i],v);h+=`<rect class="hit" data-c="${id}" data-i="${i}" x="${f.L+f.band*i}" y="${f.T}" width="${f.band}" height="${f.ph}"/><line class="hl" x1="${X(i)}" x2="${X(i)}" y1="${f.T}" y2="${f.T+f.ph}" stroke="var(--axis)" stroke-dasharray="3 3"/>`});
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(id)}">${f.g}<path d="${p}" fill="none" style="stroke:${color}" stroke-width="2"/>${m}${h}<line x1="${f.L}" x2="${W-6}" y1="${f.T+f.ph}" y2="${f.T+f.ph}" stroke="var(--axis)"/></svg>`}
const legend=L=>`<div class="lg">${L.map(([n,c])=>`<span><i style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`;
const tipBox=(title,rows)=>`<b>${esc(title)}</b>${rows.map(([n,v,c])=>`<div><span>${c?`<i style="background:${c}"></i>`:''}${esc(n)}</span><strong>${v}</strong></div>`).join('')}`;
function vProgress(){
  const P=S.progress||{activity:[],priced:[],pkgTotal:0},A=P.activity||[],byD=new Map(A.map(a=>[a.d,a]));
  const first=[A[0]&&A[0].d,HS[0]&&HS[0].d].filter(Boolean).sort()[0]||TODAY;
  const start=RANGE==='all'?first:addD(TODAY,-(+RANGE-1)),days=dayList(start,TODAY);
  const z={sent:0,followup:0,reply:0},at=(d,v)=>(byD.get(d)||{})[v]||z;
  const V=['cm','rm','eq'].map(v=>({k:v,n:NAME[v],c:VC[v]})),CW=innerWidth<700?360:560,CH=innerWidth<700?230:210;
  // KPIs over the last 7 days and totals
  const last7=dayList(addD(TODAY,-6),TODAY),sum=(D,f)=>D.reduce((a,d)=>a+f(d),0);
  const sent7=sum(last7,d=>V.reduce((a,s)=>a+at(d,s.k).sent+at(d,s.k).followup,0)),rep7=sum(last7,d=>V.reduce((a,s)=>a+at(d,s.k).reply,0));
  let cq=0;const cum=new Map();dayList(A[0]?A[0].d:TODAY,TODAY).forEach(d=>{cq+=(byD.get(d)||{}).quotes||0;cum.set(d,cq)});
  const qv=days.map(d=>cum.get(d)||0),pv=days.map(d=>(P.priced||[]).filter(x=>x<=d).length);
  const k=[['Emails sent, last 7 days',sent7,'#07599b'],['Replies received, last 7 days',rep7,'#00a888'],['Quotes received to date',cq,'#c0743a'],['Equipment packages priced',`${(P.priced||[]).length}/${P.pkgTotal||'-'}`,'#092c46']];
  const out=stack('sent',days,V.map(s=>({...s,c:s.c})),(d,s)=>at(d,s.k).sent+at(d,s.k).followup,
    d=>tipBox(fmt(d),V.map(s=>[s.n,`${at(d,s.k).sent} new · ${at(d,s.k).followup} follow-up`,s.c])),CW,CH);
  const inn=stack('reply',days,V,(d,s)=>at(d,s.k).reply,d=>tipBox(fmt(d),V.map(s=>[s.n,at(d,s.k).reply,s.c])),CW,CH);
  const ql=line('quotes',days,qv,Math.max(...qv),'var(--v-eq)',(d,v)=>tipBox(fmt(d),[['Quotes received to date',v]]),CW,CH);
  const pl=line('priced',days,pv,P.pkgTotal||Math.max(...pv),'var(--navy)',(d,v)=>tipBox(fmt(d),[['Packages with at least one price',`${v} of ${P.pkgTotal}`]]),CW,CH);
  // stage funnel: daily snapshots, carried forward over days with no change
  const snapDays=HS.length?dayList(RANGE==='all'?HS[0].d:(start>HS[0].d?start:HS[0].d),TODAY):[];
  const snapAt=d=>{let s=null;for(const x of HS){if(x.d<=d)s=x;else break}return s};
  const funnel=['cm','rm','eq'].map(v=>{
    // only stages that occur get a step, so the ramp stays readable (light = early, full hue = furthest)
    const used=s=>HS.some(x=>(x[v]||{})[s])||(S[v]||[]).some(r=>r.stage===s);
    const st=stg(v).filter(used),openSt=st.filter(s=>!/^(Rejected|No response)$/i.test(s)),n=openSt.length;
    const col=s=>openSt.includes(s)?(n<2?VC[v]:`color-mix(in srgb, ${VC[v]} ${Math.round(25+75*(openSt.indexOf(s)/(n-1)))}%, #ffffff)`):'#b9c1c7';
    const ser=st.map(s=>({n:s,c:col(s)}));
    const body=snapDays.length?stack('f'+v,snapDays,ser,(d,s)=>((snapAt(d)||{})[v]||{})[s.n]||0,d=>tipBox(fmt(d),ser.map(s=>[s.n,((snapAt(d)||{})[v]||{})[s.n]||0,s.c]).filter(r=>r[1])),CW,CH):'<div class="empty">The first snapshot is taken at the next refresh.</div>';
    return `<section class="card chart"><h2>${NAME[v]}: stage by date</h2><p class="cap">Companies at each stage, from the daily snapshot. Darker = further along; grey = closed.</p>${legend(ser.map(s=>[s.n,s.c]))}${body}</section>`});
  const tbl=`<details class="tv"><summary>Show as a table</summary><div class="tw"><table><thead><tr><th>Date</th>${V.map(s=>`<th class="r">${esc(s.n)}: sent</th><th class="r">follow-ups</th><th class="r">replies</th>`).join('')}<th class="r">Quotes to date</th></tr></thead><tbody>${days.slice().reverse().map(d=>`<tr><td class="nw">${fmt(d)}</td>${V.map(s=>`<td class="r">${at(d,s.k).sent}</td><td class="r">${at(d,s.k).followup}</td><td class="r">${at(d,s.k).reply}</td>`).join('')}<td class="r">${cum.get(d)||0}</td></tr>`).join('')}</tbody></table></div></details>`;
  return `<div class="viz">
  <div class="tools card" style="margin-bottom:14px;border-bottom:1px solid var(--line)"><span style="font-weight:600;font-size:13px">Show</span><div class="seg" role="group" aria-label="Date range">${[['14','14 days'],['30','30 days'],['all','All']].map(([v,l])=>`<button type="button" data-range="${v}" class="${RANGE===v?'on':''}">${l}</button>`).join('')}</div><span class="ct">Hover a day for the numbers</span></div>
  <div class="card kpis">${k.map(([l,n,c])=>`<div class="kpi"><span><i style="background:${c}"></i>${l}</span><b>${n}</b></div>`).join('')}</div>
  <div class="pgrid">
    <section class="card chart"><h2>Emails sent per day</h2><p class="cap">New enquiries and follow-ups, by vertical.</p>${legend(V.map(s=>[s.n,s.c]))}${out}${tbl}</section>
    <section class="card chart"><h2>Replies received per day</h2><p class="cap">Any reply, acknowledgement or quote, by vertical.</p>${legend(V.map(s=>[s.n,s.c]))}${inn}</section>
    <section class="card chart"><h2>Quotes received, running total</h2><p class="cap">Every written price or offer, all verticals.</p>${ql}</section>
    <section class="card chart"><h2>Equipment packages priced</h2><p class="cap">Packages with at least one supplier price, out of ${P.pkgTotal||0}.</p>${pl}</section>
  </div>
  <div class="pgrid">${funnel.join('')}</div>
  <div class="note">Activity comes from dated columns and notes written like "27 Nov: follow-up sent" in the trackers. Notes without a date are not counted.</div></div>`;
}
/* hover tooltips for every chart */
{const tip=document.createElement('div');tip.className='tip';tip.hidden=true;document.body.appendChild(tip);let cur=null;
  document.addEventListener('mouseover',e=>{const h=e.target.closest&&e.target.closest('.hit');if(cur&&cur!==h){cur.nextElementSibling&&cur.nextElementSibling.classList.remove('on')}
    if(!h){tip.hidden=true;cur=null;return}cur=h;h.nextElementSibling&&h.nextElementSibling.classList.add('on');tip.innerHTML=(TIPS[h.dataset.c]||[])[+h.dataset.i]||'';tip.hidden=!tip.innerHTML});
  document.addEventListener('mousemove',e=>{if(tip.hidden)return;const w=tip.offsetWidth,hh=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+hh>innerHeight-8)y=e.clientY-hh-14;tip.style.left=x+'px';tip.style.top=y+'px'});
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-range]');if(b&&S){RANGE=b.dataset.range;render(true)}});
}

function draw(){const t={cm:tCM,rm:tRM,eq:tEQ}[view];if(!t)return;const [n,h]=t();$('#tb').innerHTML=h;$('#ct').textContent=n+' shown'}
function stamp(){const d=new Date(S.asOf);$('#asof').innerHTML=`Updated from the sheets ${d.getDate()} ${MON[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`}
function render(keep){
  TODAY=today();
  const h=location.hash.slice(1),v=VIEWS[h]?h:'overview';if(!keep||v!==view)F={q:'',st:''};view=v;
  $('#nav').innerHTML=Object.entries(VIEWS).map(([k,l])=>{const n=['cm','rm','eq'].includes(k)?S[k].filter(isDue).length:0;return `<a href="#${k}" class="${k===view?'on':''}">${esc(l)}${n?`<span class="n" title="due now">${n}</span>`:''}</a>`}).join('');
  $('#title').textContent=VIEWS[view];$('#sub').textContent=SUB[view];stamp();
  const y=window.scrollY;$('#view').innerHTML={overview:vOverview,progress:vProgress,cm:vCM,rm:vRM,eq:vEQ,dates:vDates}[view]();draw();window.scrollTo(0,keep?y:0);
}
function shell(){$('#login').hidden=true;$('#app').hidden=false;$('#who').textContent='Logged in as '+who}
async function start(){
  shell();let r;
  try{r=await load()}catch(e){r='error'}
  if(r==='relogin')return logout('Logins were updated. Please log in again.');
  if(S){$('#msg').innerHTML='';render(false);return}
  $('#nav').innerHTML='';$('#title').textContent='Team portal';$('#view').innerHTML='';
  $('#msg').innerHTML=`<div class="banner">${r==='error'?'Could not load the status. Check your connection and reload.':'The status is being prepared from the tracker sheets. It appears here within about 15 minutes; this page checks by itself.'}</div>`;
}
async function poll(){
  if(!priv)return;let r;try{r=await load()}catch(e){return}
  if(r==='relogin')return logout('Logins were updated. Please log in again.');
  if(r!=='ok')return;
  const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)&&$('#view').contains(a)){pending=true;return}
  $('#msg').innerHTML='';render(true);
}
let pending=false;
setInterval(poll,5*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
document.addEventListener('focusout',()=>{if(pending){pending=false;setTimeout(()=>{if(S)render(true)},0)}});

$('#lf').addEventListener('submit',async e=>{e.preventDefault();const b=$('#lb');b.disabled=true;b.textContent='Checking…';$('#er').textContent='';
  try{await login($('#em').value,$('#pw').value);$('#pw').value='';await start()}
  catch(err){$('#er').textContent=!(window.crypto&&crypto.subtle)?'This browser cannot open the portal. Use a current Chrome, Safari or Edge.':err.message==='net'?'Could not reach the portal. Check your connection.':err.message==='nokeys'?'Logins are not set up yet.':'Email or password not recognised.'}
  b.disabled=false;b.textContent='Log in'});
$('#lo').addEventListener('click',()=>logout());
window.addEventListener('hashchange',()=>{if(S)render(false)});
document.addEventListener('input',e=>{if(!S)return;const id=e.target.id;if(id==='q')F.q=e.target.value;else if(id==='st')F.st=e.target.value;else if(id==='mt')F.mt=e.target.value;else if(id==='pk')F.pk=e.target.value;else return;draw()});
resume().then(ok=>{if(ok)start()});
}
</script>
